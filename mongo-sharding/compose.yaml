name: mongo-sharding

services:
  configSrv:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv
    command:
      - mongod
      - --configsvr
      - --replSet
      - config_rs
      - --port
      - "27019"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - configSrv_data:/data/db
    ports:
      - "27019:27019"

  shard1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1
      - --port
      - "27018"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard1_data:/data/db
    ports:
      - "27018:27018"

  shard2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2
      - --port
      - "27020"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard2_data:/data/db
    ports:
      - "27020:27020"

  mongos:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos
    command:
      - mongos
      - --configdb
      - config_rs/configSrv:27019
      - --port
      - "27017"
      - --bind_ip_all
    ports:
      - "27017:27017"
    depends_on:
      - configSrv
      - shard1
      - shard2
    restart: unless-stopped

  pymongo_api:
    container_name: pymongo_api
    build:
      context: ./api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  configSrv_data:
  shard1_data:
  shard2_data:
