name: sharding-repl-cache

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  configSrv:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv
    command:
      - mongod
      - --configsvr
      - --replSet
      - config_rs
      - --port
      - "27019"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - configSrv_data:/data/db
    ports:
      - "27019:27019"

  shard1-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-1
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1
      - --port
      - "27018"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard1_1_data:/data/db

  shard1-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-2
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1
      - --port
      - "27018"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard1_2_data:/data/db

  shard1-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-3
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1
      - --port
      - "27018"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard1_3_data:/data/db

  shard2-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-1
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2
      - --port
      - "27020"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard2_1_data:/data/db

  shard2-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-2
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2
      - --port
      - "27020"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard2_2_data:/data/db

  shard2-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-3
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2
      - --port
      - "27020"
      - --dbpath
      - /data/db
      - --bind_ip_all
    volumes:
      - shard2_3_data:/data/db

  mongos:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos
    command:
      - mongos
      - --configdb
      - config_rs/configSrv:27019
      - --port
      - "27017"
      - --bind_ip_all
    ports:
      - "27017:27017"
    depends_on:
      - configSrv
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3
    restart: unless-stopped

  pymongo_api:
    container_name: pymongo_api
    build:
      context: ./api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
      - redis
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

volumes:
  configSrv_data:
  shard1_1_data:
  shard1_2_data:
  shard1_3_data:
  shard2_1_data:
  shard2_2_data:
  shard2_3_data:
